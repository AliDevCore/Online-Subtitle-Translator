name: Build and Release Windows Executable

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (optional, defaults to v1.0.<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests -v

      - name: Build Windows Executable
        run: |
          python packaging/build_windows.py

      - name: Create Distribution Packages & Checksums
        shell: pwsh
        run: |
          # 1. Standard package (without portable.txt)
          Compress-Archive -Path "dist/Online Subtitle Translator/*" -DestinationPath "Online-Subtitle-Translator.zip" -Force

          # 2. Portable package (with portable.txt)
          "Online Subtitle Translator Portable Mode Enabled" | Out-File -Encoding utf8 "dist/Online Subtitle Translator/portable.txt"
          Compress-Archive -Path "dist/Online Subtitle Translator/*" -DestinationPath "Online-Subtitle-Translator-Portable.zip" -Force

          # 3. Checksums
          $hashStd = (Get-FileHash -Algorithm SHA256 Online-Subtitle-Translator.zip).Hash
          $hashPort = (Get-FileHash -Algorithm SHA256 Online-Subtitle-Translator-Portable.zip).Hash
          "$hashStd  Online-Subtitle-Translator.zip`n$hashPort  Online-Subtitle-Translator-Portable.zip" | Out-File -Encoding utf8 SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Online-Subtitle-Translator-Windows
          path: |
            Online-Subtitle-Translator.zip
            Online-Subtitle-Translator-Portable.zip
            SHA256SUMS.txt

      - name: Generate Release Version & Tag
        id: versioning
        shell: pwsh
        run: |
          $manualTag = "${{ inputs.tag_name }}".Trim()
          if ($manualTag -ne "") {
            $tag = $manualTag
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
          } else {
            # Ensure all remote tags are known
            git fetch --tags --force
            $highestPatch = 0
            git tag -l "v1.0.*" | ForEach-Object {
              if ($_ -match '^v1\.0\.(\d+)$') {
                $num = [int]$matches[1]
                if ($num -gt $highestPatch) { $highestPatch = $num }
              }
            }
            $runNum = [int]"${{ github.run_number }}"
            $nextPatch = [Math]::Max($highestPatch + 1, $runNum)
            $tag = "v1.0.$nextPatch"
          }
          $title = "Online Subtitle Translator $tag"
          Write-Host "Target Tag: $tag"
          Write-Host "Release Title: $title"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: ${{ steps.versioning.outputs.title }}
          files: |
            Online-Subtitle-Translator.zip
            Online-Subtitle-Translator-Portable.zip
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
