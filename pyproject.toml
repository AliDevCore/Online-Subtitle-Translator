[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "online-subtitle-translator"
version = "1.0.0"
authors = [{ name = "Online Subtitle Project" }]
description = "AI Subtitle Translator Windows Desktop Application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.8.0",
    "keyring>=24.0.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "charset-normalizer>=3.0.0",
]

[project.scripts]
online-subtitle-translator = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
